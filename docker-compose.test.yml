# Throwaway PostgreSQL for the Go integration test package (emplacc-api/test).
# The test harness (test/main_test.go) reads TEST_DB_* env vars and creates its
# own scratch database from the admin connection, so this only needs a running
# server with matching credentials on a non-default port (55432, to avoid
# colliding with any local 5432 instance).
#
# Usage:
#   docker compose -f docker-compose.test.yml up -d --wait
#   make test           # or run go test with the TEST_DB_* env vars below
#   docker compose -f docker-compose.test.yml down -v
services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: postgres
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15
